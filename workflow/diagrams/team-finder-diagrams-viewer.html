<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team-Finder Diagrams</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    select,
    button {
      height: 34px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
    }

    button {
      cursor: pointer;
    }

    button:hover,
    select:hover {
      border-color: var(--accent);
    }

    main {
      height: calc(100vh - 59px);
      overflow: auto;
      padding: 20px;
    }

    .stage {
      width: max-content;
      min-width: 100%;
      transform-origin: top left;
    }

    canvas {
      display: block;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Team-Finder Architecture Diagrams</h1>
      <span class="hint">Local canvas preview of the generated Excalidraw files.</span>
    </div>
    <div class="toolbar">
      <select id="diagram">
        <option value="team-finder-frontend-routing.excalidraw">Frontend Routing</option>
        <option value="team-finder-data-flow.excalidraw">Data Flow</option>
        <option value="team-finder-full-system.excalidraw">Full System</option>
      </select>
      <button id="zoomOut" type="button">-</button>
      <button id="zoomIn" type="button">+</button>
      <button id="reset" type="button">Reset</button>
      <button id="fit" type="button">Fit</button>
    </div>
  </header>
  <main id="scroll">
    <div id="stage" class="stage">
      <canvas id="canvas"></canvas>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const select = document.getElementById('diagram');
    const stage = document.getElementById('stage');
    const scroll = document.getElementById('scroll');
    let current = null;
    let zoom = 0.65;

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawArrowhead(x1, y1, x2, y2, color) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const len = 12;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - len * Math.cos(angle - Math.PI / 7), y2 - len * Math.sin(angle - Math.PI / 7));
      ctx.lineTo(x2 - len * Math.cos(angle + Math.PI / 7), y2 - len * Math.sin(angle + Math.PI / 7));
      ctx.closePath();
      ctx.fill();
    }

    function textLines(text, maxWidth, fontSize) {
      const result = [];
      for (const raw of String(text).split('\n')) {
        const words = raw.split(' ');
        let line = '';
        for (const word of words) {
          const test = line ? `${line} ${word}` : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            result.push(line);
            line = word;
          } else {
            line = test;
          }
        }
        result.push(line);
      }
      return result;
    }

    function bounds(elements) {
      const drawable = elements.filter(el => !el.isDeleted && el.type !== 'frame');
      const xs = drawable.flatMap(el => [el.x, el.x + Math.max(1, el.width)]);
      const ys = drawable.flatMap(el => [el.y, el.y + Math.max(1, el.height)]);
      return {
        minX: Math.min(...xs) - 40,
        minY: Math.min(...ys) - 40,
        maxX: Math.max(...xs) + 40,
        maxY: Math.max(...ys) + 40,
      };
    }

    function render() {
      if (!current) return;
      const b = bounds(current.elements);
      const dpr = window.devicePixelRatio || 1;
      const width = b.maxX - b.minX;
      const height = b.maxY - b.minY;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      canvas.width = Math.ceil(width * dpr);
      canvas.height = Math.ceil(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, -b.minX * dpr, -b.minY * dpr);
      ctx.clearRect(b.minX, b.minY, width, height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.minX, b.minY, width, height);

      for (const el of current.elements) {
        if (el.isDeleted) continue;
        ctx.globalAlpha = (el.opacity ?? 100) / 100;
        if (el.type === 'rectangle' || el.type === 'frame') {
          ctx.lineWidth = el.strokeWidth || 2;
          ctx.strokeStyle = el.strokeColor || '#1e1e1e';
          ctx.fillStyle = el.backgroundColor && el.backgroundColor !== 'transparent' ? el.backgroundColor : 'rgba(255,255,255,0)';
          roundRect(ctx, el.x, el.y, el.width, el.height, el.type === 'frame' ? 3 : 10);
          ctx.fill();
          ctx.stroke();
          if (el.type === 'frame' && el.name) {
            ctx.font = '13px Arial';
            ctx.fillStyle = '#6b7280';
            ctx.fillText(el.name, el.x + 8, el.y - 8);
          }
        }
      }

      for (const el of current.elements) {
        if (el.isDeleted || el.type !== 'arrow') continue;
        const x1 = el.x;
        const y1 = el.y;
        const x2 = el.x + el.width;
        const y2 = el.y + el.height;
        ctx.strokeStyle = el.strokeColor || '#1e1e1e';
        ctx.lineWidth = el.strokeWidth || 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        drawArrowhead(x1, y1, x2, y2, el.strokeColor || '#1e1e1e');
      }

      for (const el of current.elements) {
        if (el.isDeleted || el.type !== 'text') continue;
        const fontSize = el.fontSize || 16;
        ctx.font = `${fontSize}px Arial`;
        ctx.fillStyle = el.strokeColor || '#1e1e1e';
        ctx.textBaseline = 'top';
        const lines = textLines(el.text || '', el.width || 300, fontSize);
        lines.forEach((line, i) => {
          ctx.fillText(line, el.x, el.y + i * fontSize * 1.25);
        });
      }

      ctx.globalAlpha = 1;
      stage.style.transform = `scale(${zoom})`;
      stage.style.height = `${height * zoom}px`;
    }

    async function loadDiagram() {
      const res = await fetch(select.value);
      current = await res.json();
      render();
      scroll.scrollTo({ top: 0, left: 0 });
    }

    function fit() {
      if (!current) return;
      const b = bounds(current.elements);
      const width = b.maxX - b.minX;
      zoom = Math.min(1, Math.max(0.25, (scroll.clientWidth - 40) / width));
      render();
    }

    select.addEventListener('change', loadDiagram);
    document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(1.5, zoom + 0.1); render(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(0.2, zoom - 0.1); render(); });
    document.getElementById('reset').addEventListener('click', () => { zoom = 0.65; render(); });
    document.getElementById('fit').addEventListener('click', fit);
    window.addEventListener('resize', render);
    loadDiagram();
  </script>
</body>
</html>
