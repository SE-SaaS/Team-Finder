<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team-Finder — Interactive Workflow</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #111111;
      --surface2: #161616;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #e0e0e0;
      --text-dim: #888;
      --text-muted: #444;
      --accent: #4a9eff;
      --accent-glow: rgba(74,158,255,0.18);
      --accent-dim: rgba(74,158,255,0.06);
      --green: #3ddc84;
      --node: #161616;
      --node-border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Dot grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #252525 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 36px 28px 60px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border2);
    }

    .hdr-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .hdr-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(61,220,132,0.06);
      border: 1px solid rgba(61,220,132,0.18);
      padding: 5px 12px;
      border-radius: 3px;
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 1px;
      margin-bottom: 16px;
      background: var(--border);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 3px;
      width: fit-content;
    }

    .tab-btn {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 7px 18px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text-dim); }

    .tab-btn.active {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border2);
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tool-btn {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--text-dim);
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      border-color: #3a3a3a;
      color: var(--text);
      background: var(--surface2);
    }

    .tool-btn.danger:hover {
      border-color: rgba(255,80,80,0.4);
      color: #ff6060;
    }

    .sep { width: 1px; height: 18px; background: var(--border2); margin: 0 2px; }

    .hints {
      margin-left: auto;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .hint-item {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    kbd {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 2px;
    }

    /* ── Path label ── */
    .path-bar {
      height: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .path-info {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.2s;
      pointer-events: none;
    }

    .path-info.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Diagram panel ── */
    .diagram-panel {
      display: none;
    }

    .diagram-panel.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .cy-shell {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    /* Corner label */
    .cy-shell::before {
      content: attr(data-label);
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      z-index: 10;
      pointer-events: none;
    }

    .cy-canvas {
      width: 100%;
      height: 540px;
    }

    /* ── Label editor ── */
    #editor-overlay {
      display: none;
      position: fixed;
      z-index: 2000;
      transform: translate(-50%, -50%);
      pointer-events: all;
    }

    #editor-wrap {
      background: #0d1117;
      border: 1px solid var(--accent);
      border-radius: 5px;
      padding: 2px;
      box-shadow: 0 0 0 1px rgba(74,158,255,0.1), 0 8px 32px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
    }

    #editor-input {
      font-family: inherit;
      font-size: 11px;
      background: transparent;
      border: none;
      color: #fff;
      padding: 7px 12px;
      outline: none;
      min-width: 140px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    #editor-hint {
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
      padding: 3px 10px 6px;
      letter-spacing: 0.06em;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.07em;
      padding: 8px 16px;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.18s;
      pointer-events: none;
      z-index: 3000;
    }

    #toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #toast.ok { border-color: rgba(61,220,132,0.25); color: var(--green); }
  </style>
</head>
<body>

<div class="app">

// ─────────────────────────────────────────────────────────────────
// Utils
// ─────────────────────────────────────────────────────────────────
let toastTimer;

function toast(msg, ok = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = ok ? 'visible ok' : 'visible';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2000);
}

// ─────────────────────────────────────────────────────────────────
// Build elements array from shorthand data
// ─────────────────────────────────────────────────────────────────
function buildElements(data) {
  const nodes = data.nodes.map(n => ({
    data: { id: n.id, label: n.label, kind: n.kind }
  }));
  const edges = data.edges.map(e => ({
    data: {
      id: e.id,
      source: e.s,
      target: e.t,
      label: e.label || '',
      dash: e.dash ? true : undefined
    }
  }));
  return [...nodes, ...edges];
}

// ─────────────────────────────────────────────────────────────────
// Cytoscape instances
// ─────────────────────────────────────────────────────────────────
const cyMap = {};
const initDone = [false, false, false, false];
let activeIdx = 0;

function getActiveCy() { return cyMap[activeIdx]; }

// ─── Highlight logic ──────────────────────────────────────────────
let hlNode = null;

function highlight(cy, node) {
  clearHighlight(cy, true);
  hlNode = node;

  const eles = cy.elements();
  eles.addClass('dim');

  // The node itself + its connected edges + neighbor nodes
  const hood = node.closedNeighborhood();
  hood.removeClass('dim').addClass('hl');
  node.removeClass('dim').addClass('hl');

  document.getElementById('path-info').classList.add('visible');
}

function clearHighlight(cy, silent = false) {
  cy.elements().removeClass('dim').removeClass('hl');
  hlNode = null;
  if (!silent) {
    document.getElementById('path-info').classList.remove('visible');
  }
}

// ─── Label editor ─────────────────────────────────────────────────
let editNode = null;

function openEditor(cy, node) {
  editNode = node;
  editCy   = cy;

  const pos  = node.renderedPosition();
  const rect = cy.container().getBoundingClientRect();
  const overlay = document.getElementById('editor-overlay');
  const input   = document.getElementById('editor-input');

  overlay.style.left = (rect.left + pos.x) + 'px';
  overlay.style.top  = (rect.top  + pos.y) + 'px';
  overlay.style.display = 'block';

  // Show current label; replace literal newline with space for editing comfort
  input.value = node.data('label').replace(/\n/g, ' / ');
  input.focus();
  input.select();
}

function commitEditor() {
  const input = document.getElementById('editor-input');
  const val   = input.value.trim();
  if (val && editNode) {
    // Turn ' / ' back into newline
    const newLabel = val.replace(/\s*\/\s*/g, '\n');
    editNode.data('label', newLabel);
    toast('Label updated ✓', true);
  }
  closeEditor();
}

function closeEditor() {
  document.getElementById('editor-overlay').style.display = 'none';
  editNode = null;
  editCy   = null;
}

document.getElementById('editor-input').addEventListener('keydown', e => {
  if (e.key === 'Enter')  { e.preventDefault(); commitEditor(); }
  if (e.key === 'Escape') { closeEditor(); }
});

document.getElementById('editor-input').addEventListener('blur', () => {
  // Small delay so Enter key can commit first
  setTimeout(closeEditor, 120);
});

// ─── Init a single diagram ─────────────────────────────────────────
function initDiagram(idx) {
  if (initDone[idx]) return;
  initDone[idx] = true;

  const cy = cytoscape({
    container: document.getElementById(`cy${idx}`),
    elements:  buildElements(DIAGRAMS[idx]),
    style:     CY_STYLE,
    layout: {
      name:     'dagre',
      rankDir:  'LR',
      padding:  50,
      nodeSep:  55,
      rankSep:  85,
      edgeSep:  15,
      animate:  false,
    },
    minZoom: 0.25,
    maxZoom: 4,
    selectionType: 'single',
  });

  // ── Click node → highlight ──
  cy.on('tap', 'node', function(evt) {
    const node = evt.target;
    if (hlNode && hlNode.id() === node.id()) {
      clearHighlight(cy);
    } else {
      highlight(cy, node);
    }
  });

  // ── Click background → clear ──
  cy.on('tap', function(evt) {
    if (evt.target === cy) clearHighlight(cy);
  });

  // ── Double-click → edit label ──
  cy.on('dblclick', 'node', function(evt) {
    openEditor(cy, evt.target);
  });

  cyMap[idx] = cy;
}

// ─── Activate tab ──────────────────────────────────────────────────
function activateTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.diagram-panel').forEach((p, i) => {
    p.classList.toggle('active', i === idx);
  });

  // Clear highlight in old cy
  if (cyMap[activeIdx]) clearHighlight(cyMap[activeIdx]);

  activeIdx = idx;
  initDiagram(idx);
}

// ─── Toolbar ──────────────────────────────────────────────────────
document.getElementById('btn-fit').addEventListener('click', () => {
  const cy = getActiveCy();
  if (cy) cy.fit(undefined, 50);
});

document.getElementById('btn-zin').addEventListener('click', () => {
  const cy = getActiveCy();
  if (!cy) return;
  cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
});

document.getElementById('btn-zout').addEventListener('click', () => {
  const cy = getActiveCy();
  if (!cy) return;
  cy.zoom({ level: cy.zoom() * 0.8, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
});

document.getElementById('btn-clear').addEventListener('click', () => {
  const cy = getActiveCy();
  if (cy) clearHighlight(cy);
});

document.getElementById('btn-relayout').addEventListener('click', () => {
  const cy = getActiveCy();
  if (!cy) return;
  clearHighlight(cy);
  cy.layout({
    name:     'dagre',
    rankDir:  'LR',
    padding:  50,
    nodeSep:  55,
    rankSep:  85,
    edgeSep:  15,
    animate:  true,
    animationDuration: 350,
    animationEasing: 'ease-in-out-cubic',
  }).run();
  toast('Layout reset');
});

// ─── Tab buttons ──────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach((btn, i) => {
  btn.addEventListener('click', () => activateTab(i));
});

// ─── Boot ─────────────────────────────────────────────────────────
activateTab(0);
</script>
